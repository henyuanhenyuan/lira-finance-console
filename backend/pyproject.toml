[project]
name = "lira-financial-agent"
version = "2.0.0"
description = "Lira 财务智能体控制台 — FastAPI + LangGraph + pgvector + MCP 多智能体"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "numpy>=2.1",
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "mcp>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
