name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ./backend
      - name: Compile
        run: python -m compileall -q backend/app
      - name: Import check
        run: python -c "import app.main; print('routes', len(app.main.app.routes))"
        env:
          PYTHONPATH: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --prefix frontend
      - name: Build
        run: npm run build --prefix frontend
