[project]
name = "lira-local"
version = "0.1.0"
description = "Lira local profit diagnosis"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=43",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "watchdog>=4",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q"
